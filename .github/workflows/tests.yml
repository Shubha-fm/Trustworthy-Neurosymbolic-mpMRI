name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build synthetic demo
        run: python scripts/make_synthetic_demo.py

      - name: Build synthetic labels
        run: python scripts/build_labels.py --input data/synthetic_demo/volumes.csv --output data/synthetic_demo/labels.csv

      - name: Check reported results
        run: python scripts/check_reported_results.py
