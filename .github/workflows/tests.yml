name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/make_synthetic_demo.py
      - run: python scripts/build_labels.py --input data/synthetic_demo/volumes.csv --output data/synthetic_demo/labels.csv
      - run: python scripts/check_reported_results.py
